name: tests

# The guard suite, the package contract suite and both source-contract runners on the minimum Python (3.9), on 3.12 and
# on 3.14 (the python3 the hooks run under), on Windows and on Linux; plus the version agreement of every version
# statement and of a release tag. Actions are pinned by full commit SHA (the tag is in the comment).

on:
  push:
    branches: [main, develop_claude, develop_codex]
    tags: ["v*"]
  pull_request:
    branches: [main, develop_claude, develop_codex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  versions:
    name: version agreement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the test runner
        run: python -m pip install "pytest==9.1.1"
      - name: Every version statement equals plugin.yaml
        run: python -m pytest tests/codex/guard/test_package.py::test_versions_agree -q -p no:cacheprovider
      - name: A release tag names the plugin.yaml version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version: *\([^ ]*\) *$/\1/p' plugin.yaml)"
          if [ "$TAG" != "v$version" ]; then
            printf 'tag %s is not v%s\n' "$TAG" "$version"
            exit 1
          fi

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.12", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the test runner
        # pytest 9 needs Python 3.10+; the 3.9 legs use the last pytest that supports it
        run: python -m pip install "pytest==9.1.1; python_version >= '3.10'" "pytest==8.4.2; python_version < '3.10'" "PyYAML==6.0.3"
      - name: Interpreter, git and sh
        run: |
          python -VV
          git --version
          command -v sh
      - name: Guard suite
        run: python -m pytest tests/codex/guard -q -p no:cacheprovider -ra --basetemp="$RUNNER_TEMP/guard"
      - name: Package contract suite
        run: python -X utf8 tests/codex/contracts/test_agent_plugin.py
      - name: Source-contract cases
        run: |
          python -X utf8 tests/codex/contracts/run_contract_cases.py --check
          python -X utf8 tests/claude/scripts/run_claude_contracts.py --check
      - name: The run left the checkout untouched
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi

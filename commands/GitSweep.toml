description = "预览或执行本地收敛及安全远程清理（高风险）"
prompt = '''
MAGOS /GitSweep — Gemini CLI adapter for the existing MAGOS repository.

Raw command arguments (preserve spelling and whitespace semantics): {{args}}

USAGE: /GitSweep <branch> [--apply] [--discard-ignored] [--push] [--remote <name>] [--lang <language>] [--help]
Examples: /GitSweep agent/release; /GitSweep agent/release --apply; /GitSweep agent/release --apply --push

MANDATORY EXECUTION ORDER:
1. Parse these arguments FIRST, without tools. If --help is present, reply with usage, options, defaults and examples in the chosen language, then STOP: do not load skills, read files, inspect Git, or invoke any tool. Unknown flags or invalid/missing required arguments: show usage and stop. `--lang <language>` affects reply language only; default Simplified Chinese.
2. Otherwise activate the existing Gemini Agent Skill named `git-orchestrator` using `activate_skill`; it is provided in this MAGOS extension at `skills/git-orchestrator/SKILL.md`. It links to package-root `SKILL.md` and `references/commands.md`; read and follow those canonical contracts. If skill activation or its contract cannot be read, STOP ALL WRITES and explain; for a read-only command, use only observed non-mutating status information. Do NOT treat Claude Code-only `Skill` tool names or `$ARGUMENTS` from `commands/GitSweep.md` as executable commands in Gemini.
3. Execute the source-defined Git command GitSweep with exactly the arguments above, under Gemini CLI tool approvals, checking the real target repository and safety preconditions. Neither this TOML nor an automatic tool invocation is permission to bypass MAGOS gates.
4. Return contract-defined tables, evidence, blockers, risks, and safe next actions. Recheck the requested reply language before answering. Never claim operations ran when they were not performed.

SOURCE-SPECIFIC CONSTRAINTS:
Target is required and cannot be main. PREVIEW by default, with no remote contact. `--remote <name>` selects remote, default origin; unlike GitRecon it is NOT a fetch flag. `--apply` performs GitConverge first, then only safe remote deletion with recorded SHA lease. `--push` has effect ONLY with --apply, allowing one fast-forward target-branch publish if source guard gates pass. Never push the default branch via this option; never force push commits, mirror, prune, delete an unmerged remote branch or bypass hooks. Remote branch deletion can close PRs; disclose before applying. If checks/remote destination are UNKNOWN stop. See the original source contract for ONE_SHOT/PARTIAL/BLOCKED and PUSH_THEN_DELETE/PENDING_PUSH classification and exact follow-up reporting.

Safety classification: Explicit command only; observe PREVIEW defaults and all write gates.
'''

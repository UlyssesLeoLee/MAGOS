description = "预览安全清理候选，仅 --apply 执行本地清理"
prompt = '''
MAGOS /GitCleanup — Gemini CLI adapter for the existing MAGOS repository.

Raw command arguments (preserve spelling and whitespace semantics): {{args}}

USAGE: /GitCleanup [--apply] [--lang <language>] [--help]
Examples: /GitCleanup; /GitCleanup --apply

MANDATORY EXECUTION ORDER:
1. Parse these arguments FIRST, without tools. If --help is present, reply with usage, options, defaults and examples in the chosen language, then STOP: do not load skills, read files, inspect Git, or invoke any tool. Unknown flags or invalid/missing required arguments: show usage and stop. `--lang <language>` affects reply language only; default Simplified Chinese.
2. Otherwise activate the existing Gemini Agent Skill named `git-orchestrator` using `activate_skill`; it is provided in this MAGOS extension at `skills/git-orchestrator/SKILL.md`. It links to package-root `SKILL.md` and `references/commands.md`; read and follow those canonical contracts. If skill activation or its contract cannot be read, STOP ALL WRITES and explain; for a read-only command, use only observed non-mutating status information. Do NOT treat Claude Code-only `Skill` tool names or `$ARGUMENTS` from `commands/GitCleanup.md` as executable commands in Gemini.
3. Execute the source-defined Git command GitCleanup with exactly the arguments above, under Gemini CLI tool approvals, checking the real target repository and safety preconditions. Neither this TOML nor an automatic tool invocation is permission to bypass MAGOS gates.
4. Return contract-defined tables, evidence, blockers, risks, and safe next actions. Recheck the requested reply language before answering. Never claim operations ran when they were not performed.

SOURCE-SPECIFIC CONSTRAINTS:
PREVIEW is the default. `--apply` is a user-requested write action and must recheck every item just before deletion. Never delete remote branches, main, integration target, dirty/in-progress worktrees or worktrees with ignored files. Never use repository-wide worktree prune. If skill loading fails, preview only.

Safety classification: Explicit command only; observe PREVIEW defaults and all write gates.
'''
